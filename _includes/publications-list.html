<div class="publication-list">
{% for publication in site.data.publications %}
  <article class="publication-item">
    <div class="publication-year">{{ publication.year }}</div>
    <div class="publication-details">
      <h3 class="publication-title">{{ publication.title }}</h3>
      <p class="publication-authors">{{ publication.authors | replace: "Junteng Liu", "<strong>Junteng Liu</strong>" }}</p>
      <div class="publication-meta">
        <span>{{ publication.venue }}</span>
        <span>{{ publication.role }}</span>
        {% if publication.code %}<span>Code: {{ publication.code }}</span>{% endif %}
      </div>
    </div>
  </article>
{% endfor %}
</div>
