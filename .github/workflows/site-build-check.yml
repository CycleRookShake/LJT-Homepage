name: Site build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Minify JS files
        run: |
          npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --trace
        env:
          JEKYLL_ENV: production
      - name: Verify rendered content
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("_site/index.html").read_text()
          publications = Path("_site/publications/index.html").read_text()

          required = [
              "Junteng Liu",
              "First-year PhD candidate at the HKUST NLP Group",
              "Academic Background",
              "Ph.D. in Computer Science",
              "Shanghai Jiao Tong University",
              "Research Experience",
              "MINIMAX",
              "Tencent WXG",
              "Shanghai AI Lab",
              "Skills &amp; Research Areas",
              "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond",
              "On the Perception Bottleneck of VLMs for Chart Understanding",
              "On the Universal Truthfulness Hyperplane Inside LLMs",
              "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation",
              "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models",
              "Composing Parameter-Efficient Modules with Arithmetic Operations",
              "jliugi@connect.ust.hk",
              "Vicent0205",
              "@junteng88716710",
          ]

          for phrase in required:
              assert phrase in index, f"Missing from homepage: {phrase}"

          for phrase in required[10:16]:
              assert phrase in publications, f"Missing from publications page: {phrase}"

          assert "Academic Pages is a ready-to-fork" not in index
          assert "Your Name" not in index
          print("Rendered homepage and publications page contain all expected personal content.")
          PY
